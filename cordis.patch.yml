# The git capsule's Host row.
- insert:
    - id: dsh-git-bar
      name: 'dsh-git-bar'
    # GitHub's hosted MCP server (tools appear as mcp__github__*). This row is the
    # optional environment-variable path: it mounts only when the operator puts
    # DSH_GIT_BAR_GITHUB_TOKEN in the process environment. Without it the Host half
    # mounts the same server at runtime with the token from the credential store,
    # so an ordinary install needs no setup. The token never appears in this file.
    - id: dsh-git-bar/github-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: '!!js !process.env.DSH_GIT_BAR_GITHUB_TOKEN'
      config:
        serverName: github
        transport: streamable-http
        url: https://api.githubcopilot.com/mcp/
        failOnStartupError: false
        headers:
          Authorization: '!!js `Bearer ${process.env.DSH_GIT_BAR_GITHUB_TOKEN ?? ""}`'
