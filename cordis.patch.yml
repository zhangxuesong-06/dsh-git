# The git capsule's Host row.
- insert:
    - id: dsh-git-bar
      name: 'dsh-git-bar'
    # GitHub's hosted MCP server (tools appear as mcp__github__*). The row stays
    # disabled until the user signs in: the Host half then writes
    # DSH_GIT_BAR_GITHUB_TOKEN into the Harness-home `.env`, which DSH loads at
    # boot. Restart DSH after signing in to mount it; signing out clears the
    # variable again. The token never appears in this file.
    - id: dsh-git-bar/github-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: '!!js !process.env.DSH_GIT_BAR_GITHUB_TOKEN'
      config:
        serverName: github
        transport: streamable-http
        url: https://api.githubcopilot.com/mcp/
        failOnStartupError: false
        headers:
          Authorization: '!!js `Bearer ${process.env.DSH_GIT_BAR_GITHUB_TOKEN ?? ""}`'
