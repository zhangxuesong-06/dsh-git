name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Give git an identity through config rather than GIT_AUTHOR_* env vars:
      # those env vars override per-command `-c user.name=…`, and the tests use
      # that to create commits by specific authors.
      - name: Configure git
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
      - name: Syntax check
        run: npm run check
      - name: Self-tests
        run: npm test
        env:
          GIT_TERMINAL_PROMPT: '0'

  publish:
    name: publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Pushing a backlog of old tags must not turn the run red: publishing a
      # version that is already on npm is a no-op, not a failure.
      - name: Look up the version on npm
        id: lookup
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "dsh-git-bar@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Already published
        if: steps.lookup.outputs.exists == 'true'
        run: echo "dsh-git-bar@${{ steps.lookup.outputs.version }} is already on npm; nothing to publish."
      - name: Publish
        if: steps.lookup.outputs.exists == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
